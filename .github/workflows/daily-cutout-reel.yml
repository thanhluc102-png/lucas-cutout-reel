name: Daily Cutout Reel (Auto-Poster Facebook)

# Pipeline tự động tạo & đăng Reel Cutout + Dynamic Motion lên Facebook Page Lucas Combo:
# Pick sản phẩm -> AI (Claude) viết scenes.json & caption giật tít -> Voice ElevenLabs 
# -> Whisper & Align -> Render MP4 -> QC -> Auto-Post Facebook Fanpage + Comment link mua -> Commit history.
#
# Chạy tay: dry_run mặc định true (render xem thử, KHÔNG đăng).
# Đăng thật: Cloudflare (worker lucas-reel-cron, repo lucas-daily-reel) gọi workflow_dispatch đúng 20:00 VN với guard=true,
# vì cron của GitHub hay trễ 6–8 tiếng. Hai mốc cron dưới đây giữ làm dự phòng (guard tự bỏ qua nếu đã đăng).

on:
  schedule:
    - cron: '0 13 * * *'    # 20:00 VN — ca Tối (chính)
    - cron: '30 14 * * *'   # 21:30 VN — nhịp dự phòng tối (guard tự bỏ qua nếu 20:00 đã đăng)
  workflow_dispatch:
    inputs:
      product_id:
        description: 'ID sản phẩm WooCommerce (để trống = tự chọn theo thuật toán pick-daily)'
        required: false
        default: ''
      dry_run:
        description: 'true = render + xem trước, KHÔNG đăng (đặt false khi đã duyệt)'
        required: false
        default: 'true'
      guard:
        description: 'true = bỏ qua nếu đã đăng trong 14 tiếng (Cloudflare lucas-reel-cron gọi đúng giờ với true; chạy tay để false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: cutout-reel
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: g
        env:
          POST_MIN_HOURS: '14'
        run: node lib/already-posted.mjs

  reel:
    needs: guard
    # Chạy tay: luôn chạy. Cloudflare gọi đúng giờ (guard=true): vẫn tôn trọng giãn cách 14 tiếng như lượt cron.
    if: needs.guard.outputs.skip != 'true' || (github.event_name == 'workflow_dispatch' && inputs.guard != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài Python Dependencies (rembg, pillow, numpy)
        run: pip install --upgrade pip && pip install rembg pillow numpy

      - name: Cài FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg && ffmpeg -version | head -1

      - name: Cài Chrome cho puppeteer-core
        run: |
          OUT=$(npx --yes @puppeteer/browsers install chrome@stable)
          BIN=$(echo "$OUT" | awk '{print $2}')
          test -x "$BIN"
          echo "PUPPETEER_EXECUTABLE_PATH=$BIN" >> "$GITHUB_ENV"

      - name: Cache model whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3-v1

      - name: Cài faster-whisper
        run: pip install faster-whisper

      - name: Cài dependency Node
        # onnxruntime-node (kéo theo từ hyperframes) mặc định tải thêm bản CUDA/GPU trên Linux x64;
        # file đó trên GitHub release đã 404 từ 18/11 → npm ci lỗi. Runner không có GPU nên bỏ qua,
        # bản CPU đã có sẵn trong gói npm.
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci || npm install

      - name: Chọn sản phẩm
        id: pick
        run: node lib/pick-daily.mjs ${{ inputs.product_id }}

      - name: AI viết scenes.json & Caption giật tít
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'claude-opus-5-5' }}
          ELEVEN_VOICE_ID: ${{ vars.ELEVEN_VOICE_ID }}
        run: node scripts/gen-scenes.mjs ${{ steps.pick.outputs.id }}

      - name: Giọng đọc ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          EL_VOICE_SOUTH: ${{ vars.EL_VOICE_SOUTH }}
          EL_VOICE_NORTH: ${{ vars.EL_VOICE_NORTH }}
        run: node scripts/voice.mjs ${{ steps.gen.outputs.file }}

      - name: Căn chữ (whisper) + align
        run: |
          JOB="${{ steps.gen.outputs.job }}"
          python scripts/whisper_words.py "jobs/$JOB/voice.mp3" "jobs/$JOB/words.json" --model large-v3
          node scripts/align.mjs "${{ steps.gen.outputs.file }}"

      - name: Render MP4
        run: node scripts/render-painpoint.mjs ${{ steps.gen.outputs.file }}

      - name: QC Kiểm tra Video
        run: node scripts/qc.mjs "jobs/${{ steps.gen.outputs.job }}/final.mp4" "${{ steps.gen.outputs.file }}"

      - name: Lưu Artifact xem trước
        uses: actions/upload-artifact@v4
        with:
          name: cutout-reel-${{ steps.pick.outputs.id }}
          path: |
            jobs/${{ steps.gen.outputs.job }}/final.mp4
            ${{ steps.gen.outputs.file }}
          retention-days: 14

      - name: Tự động Đăng lên Facebook Fanpage Lucas Combo
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          CAPTION_FILE: jobs/${{ steps.gen.outputs.job }}/caption.txt
          COMMENT_FILE: jobs/${{ steps.gen.outputs.job }}/comment.txt
        run: node lib/post-reel.mjs "jobs/${{ steps.gen.outputs.job }}/final.mp4"

      - name: Đồng bộ tương tác + rút bài học
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == 'false' }}
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/sync-insights.mjs
          node scripts/optimize.mjs

      - name: Ghi sổ nhật ký đăng bài
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == 'false' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in history.json reels_history.json learnings.txt; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet && exit 0
          git commit -m "chore: auto-posted cutout reel $(date -u +%F) [skip ci]"
          git pull --rebase --autostash
          git push
